<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AMP Community Engagement Events</title>
    <style>
      :root {
        --bg: #ffffff;
        --card-bg: #f2f4f6;
        --border: #e2e2e2;
        --text: #002b49;
        --muted: #4d6b80;
        --accent: #005d9e;
      }
      * { box-sizing: border-box; }
      body {
        background: var(--bg);
        color: var(--text);
        margin: 0;
        padding: 2rem 1rem 4rem;
      }
      h1 {
        text-align: center;
        font-size: 1.8rem;
        margin-bottom: 2.5rem;
      }
      .month {
        max-width: 640px;
        margin: 0 auto 1rem;
      }
      .month-header {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        cursor: pointer;
        padding: 0.4rem 1rem;
        background: #002b49;
        color: #ffffff;
        border-radius: 8px;
        user-select: none;
      }
      .month-header h2 {
        .margin: 0;
        font-size: 1.1rem;
      }
      .arrow {
        display: inline-block;
        transition: transform 0.2s ease;
        font-size: 0.9rem;
        color: #fff;
      }
      .month.collapsed .arrow {
        transform: rotate(-90deg);
      }
      .event-list {
        overflow: hidden;
        max-height: 2000px;
        transition: max-height 0.3s ease, opacity 0.2s ease;
        opacity: 1;
      }
      .month.collapsed .event-list {
        max-height: 0;
        opacity: 0;
      }
      .event {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 1rem;
        margin: 0.75rem 0;
      }
      .event-title {
        font-weight: 600;
        margin-bottom: 0.25rem;
      }
      .event-meta {
        font-size: 0.85rem;
        color: var(--muted);
        margin-bottom: 0.5rem;
      }
      .event-meta span::after {
        content: " · ";
      }
      .event-meta span:last-child::after {
        content: "";
      }
      .event-desc {
        font-size: 0.95rem;
        line-height: 1.4;
      }
    </style>
  </head>

  <body>
    <h1>Fall 2026 Community Engagement Events</h1>

    <div id="event-container"></div>

    <script>
      function weeklyEvents({ title, time, location, description, startDate, endDate, exceptions = [] }){
        const results = [];
        let current = new Date(startDate + "T00:00:00");
        const end = new Date(endDate + "T00:00:00");

        while(current <= end) {
          const dateStr = current.tolSOString().split("T")[0];
          if(!exceptions.includes(dateStr)) {
            results.push({ title, time, location, description, date: dateStr });
          }
          current.setDate(current.getDate() + 7);
        }
        return results;
      }
      
      const events = [   
        {
          title: "Regis Biology Seminar: Investigating aerial data pre-processing and site-level methane emission aggregation methods at LNG facilities",
          date: "2026-09-28",
          time: "5:00 - 5:55 pm",
          location: "Science Amphitheater",
          description: "Presentation by Olga Khaliukova, PhD candidate, School of Mines"
        },
        {
          title: "Denver Astronomical Society Talk: A Graphical Tour of the Cosmos, Dr. Ed Friedman",
          date: "2026-09-14",
          time: "7:00 - 9:00 pm",
          location: "Secular Hub, 254 Knox Ct, Denver, 80219",
          description: 'Presentation at the September general meeting of the Denver Astronomical Society. See the <a href="https://www.denverastro.org/events/general-meeting-10/?occurrence=2026-09-14" target="_blank" rel="noopener noreferrer">DAS page</a> for the event for more info.'
        },
        {
          title: "AMP Tea, Hosted by Dr. T.",
          date: "2026-09-21",
          time: "3:00 - 4:00 pm",
          location: "Regis Room (Carroll 125)",
          description: "Enjoy tea and snacks with us, while working on math puzzles."
        },
        {
          title: "Denver Astronomical Society Talk: TBD",
          date: "2026-10-12",
          time: "7:00 - 9:00 pm",
          location: "Secular Hub, 254 Knox Ct, Denver, 80219",
          description: 'Presentation at the October general meeting of the Denver Astronomical Society. See the <a href="https://www.denverastro.org/events/general-meeting-11/?occurrence=2026-10-12" target="_blank" rel="noopener noreferrer">DAS page</a> for the event for more info.'
        },
        {
          title: "AMP Tea, Hosted by Dr. Casanova",
          date: "2026-10-21",
          time: "3:30 - 4:30 pm",
          location: "Regis Room (Carroll 125)",
          description: "Enjoy tea and snacks with us, while hearing updates from the Space Balloon Team"
        },
        {
          title: "Denver Astronomical Society Talk: TBD",
          date: "2026-11-09",
          time: "7:00 - 9:00 pm",
          location: "Secular Hub, 254 Knox Ct, Denver, 80219",
          description: 'Presentation at the November general meeting of the Denver Astronomical Society. See the <a href="https://www.denverastro.org/events/general-meeting-12/?occurrence=2026-11-09" target="_blank" rel="noopener noreferrer">DAS page</a> for the event for more info.'
        },
        {
          title: "AMP Tea, Hosted by Dr. Seibert",
          date: "2026-11-18",
          time: "3:30 - 4:30 pm",
          location: "Loyola 4",
          description: "Enjoy tea and snacks with us, while working on problems from past Putnam exams"
        },
        {
          title: "Putnam Exam",
          date: "2026-12-05",
          time: "8:00 am - ??",
          location: "TBD",
          description: "Try the exam often called the World's Hardest Math Competition! In order to get the community engagement credit, you must work on problems throughout the morning session, and stay for lunch (which we'll provide). Reach out to Dr. Seibert to sign up or for more information."
        }
      ];
      
      const monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];

      function formatDate(dateStr) {
        const d = new Date(dateStr + "T00:00:00");
        return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
      }

      function groupByMonth(events) {
        const groups = {};
        events.forEach(ev => {
          const d = new Date(ev.date + "T00:00:00");
          const key = `${d.getFullYear()}-${String(d.getMonth()).padStart(2, "0")}`;
          if (!groups[key]) groups[key] = { label: `${monthNames[d.getMonth()]} ${d.getFullYear()}`, items: [] };
          groups[key].items.push(ev);
        });
        // sort by chronological key
        return Object.keys(groups).sort().map(key => groups[key]);
      }

      function render() {
        const container = document.getElementById("event-container");
        const grouped = groupByMonth(events);
    
        grouped.forEach((group, idx) => {
          const monthDiv = document.createElement("div");
          monthDiv.className = "month";
    
          const header = document.createElement("div");
          header.className = "month-header";
          header.innerHTML = `<span class="arrow">▼</span><h2>${group.label}</h2>`;
          header.addEventListener("click", () => {
            monthDiv.classList.toggle("collapsed");
          });
    
          const list = document.createElement("div");
          list.className = "event-list";
    
          group.items
            .sort((a, b) => new Date(a.date) - new Date(b.date))
            .forEach(ev => {
              const card = document.createElement("div");
              card.className = "event";
              card.innerHTML = `
                <div class="event-title">${ev.title}</div>
                <div class="event-meta">
                  <span>${formatDate(ev.date)}</span>
                  <span>${ev.time}</span>
                  <span>${ev.location}</span>
                </div>
                <div class="event-desc">${ev.description}</div>
              `;
              list.appendChild(card);
            });
    
          monthDiv.appendChild(header);
          monthDiv.appendChild(list);
          container.appendChild(monthDiv);
        });
      }
    
      render();
    </script>
  </body>
</html>
