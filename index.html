<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AMP Community Engagement Events</title>
    <style>
      :root {
        --bg: #fafafa;
        --card-bg: #ffffff;
        --border: #e2e2e2;
        --text: #1a1a1a;
        --muted: #666;
        --accent: #2b5fb3;
      }
      * { box-sizing: border-box; }
      body {
        background: var(--bg);
        color: var(--text);
        margin: 0;
        padding: 2rem 1rem 4rem;
      }
      h1 {
        text-align: center;
        font-size: 1.8rem;
        margin-bottom: 2.5rem;
      }
      .month {
        max-width: 640px;
        margin: 0 auto 1rem;
      }
      .month-header {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        cursor: pointer;
        padding: 0.75rem 1rem;
        background: #f0f0f0;
        border-radius: 8px;
        user-select: none;
      }
      .month-header h2 {
        .margin: 0;
        font-size: 1.1rem;
      }
      .arrow {
        display: inline-block;
        transition: transform 0.2s ease;
        font-size: 0.9rem;
        color: var(--muted);
      }
      .month.collapsed .arrow {
        transform: rotate(-90deg);
      }
      .event-list {
        overflow: hidden;
        max-height: 2000px;
        transition: max-height 0.3s ease, opacity 0.2s ease;
        opacity: 1;
      }
      .month.collapsed .event-list {
        max-height: 0;
        opacity: 0;
      }
      .event {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 1rem;
        margin: 0.75rem 0;
      }
      .event-title {
        font-weight: 600;
        margin-bottom: 0.25rem;
      }
      .event-meta {
        font-size: 0.85rem;
        color: var(--muted);
        margin-bottom: 0.5rem;
      }
      .event-meta span::after {
        content: " · ";
      }
      .event-meta span:last-child::after {
        content: "";
      }
      .event-desc {
        font-size: 0.95rem;
        line-height: 1.4;
      }
    </style>
  </head>

  <body>
    <h1>Fall 2026 Community Engagement Events</h1>

    <div id="event-container"></div>

    <script>
      const events = [
        {
          title: "Denver Astronomical Society Talk: A Graphical Tour of the Cosmos, Dr. Ed Friedman",
          date: "2026-09-14",
          time: "7:00 - 9:00 pm",
          location: "254 Knox Ct, Denver, 80219",
          description: "Presentation at the September general meeting of the Denver Astronomical Society."
        },
        {
          title: "AMP Tea, Hosted by Dr. T.",
          date: "2026-09-21",
          time: "3:00 - 4:00 pm",
          location: "TBD",
          description: "Enjoy tea and snacks with us, while working on math puzzles."
        },
        {
          title: "AMP Tea, Hosted by Dr. Casanova",
          date: "2026-10-21",
          time: "3:30 - 4:30 pm",
          location: "TBD",
          description: "Enjoy tea and snacks with us, while hearing updates from the Space Balloon Team"
        },
        {
          title: "AMP Tea, Hosted by Dr. Seibert",
          date: "2026-11-18",
          title: "3:30 - 4:30 pm",
          location: "TBD",
          description: "Enjoy tea and snacks with us, while working on problems from past Putnam exams"
        }
      ];
      const monthNames = ["September", "October", "November", "December"];

      function formatDate(dateStr) {
        const d = new Date(dateStr + "T00:00:00");
        return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
      }

      function groupByMonth(events) {
        const groups = {};
        events.forEach(ev => {
          const d = new Date(ev.date + "T00:00:00");
          const key = `${d.getFullYear()}-${d.getMonth()}`;
          if (!groups[key]) groups[key] = { label: `${monthNames[d.getMonth()]} ${d.getFullYear()}`, items: [] };
          groups[key].items.push(ev);
        });
        // sort by chronological key
        return Object.keys(groups).sort().map(key => groups[key]);
      }

      function render() {
        const container = document.getElementById("event-container");
        const grouped = groupByMonth(events);
    
        grouped.forEach((group, idx) => {
          const monthDiv = document.createElement("div");
          monthDiv.className = "month";
    
          const header = document.createElement("div");
          header.className = "month-header";
          header.innerHTML = `<span class="arrow">▼</span><h2>${group.label}</h2>`;
          header.addEventListener("click", () => {
            monthDiv.classList.toggle("collapsed");
          });
    
          const list = document.createElement("div");
          list.className = "event-list";
    
          group.items
            .sort((a, b) => new Date(a.date) - new Date(b.date))
            .forEach(ev => {
              const card = document.createElement("div");
              card.className = "event";
              card.innerHTML = `
                <div class="event-title">${ev.title}</div>
                <div class="event-meta">
                  <span>${formatDate(ev.date)}</span>
                  <span>${ev.time}</span>
                  <span>${ev.location}</span>
                </div>
                <div class="event-desc">${ev.description}</div>
              `;
              list.appendChild(card);
            });
    
          monthDiv.appendChild(header);
          monthDiv.appendChild(list);
          container.appendChild(monthDiv);
        });
      }
    
      render();
    </script>

  </body>
</html>
